<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>サロン集客タイプ無料診断</title>

    <!-- =========================
         CTA遷移先への事前接続
    ========================== -->
    <link
      rel="preconnect"
      href="https://sendenhi-zero.com"
    />
    <link
      rel="preconnect"
      href="https://utage-system.com"
    />

    <!-- =========================
         試用アクセス（preview=1）の判定
         preview=1 のタブでは GAS・Clarity・Meta Pixel に送信しない。
         判定はここで一度だけ行い、タブ内（sessionStorage）にも保持する。
    ========================== -->
    <script>
      ;(function (w) {
        var KEY = 'salon_preview_access'
        var url = w.location.search + w.location.hash
        var preview = /[?&]preview=1(?:[&#]|$)/.test(url)

        try {
          if (preview) w.sessionStorage.setItem(KEY, '1')
          else preview = w.sessionStorage.getItem(KEY) === '1'
        } catch (e) {}

        // Vercelのプレビュー公開（チーム確認用）は、URLに関係なく常に試用アクセス扱い
        if ('%VITE_VERCEL_ENV%' === 'preview') preview = true

        w.__SALON_PREVIEW__ = preview

        // 開始前のGAS実測確認モード（2026/10/23 承認）
        // 確認用URLの4条件がすべてそろい、試用アクセスではなく、開始前のときだけ有効。
        // GASには通常どおり送信し、Clarity・Meta Pixel は読み込まない。
        // 開始日時は src/utils/campaign.js の CAMPAIGN_START_AT と同じ値にすること。
        // App.jsx はこの判定結果を参照する（判定条件はここだけに置く）。
        var CHECK_START_AT = '2026-10-26T00:00:00+09:00'
        var q = new URLSearchParams(w.location.search)
        var v = function (k) {
          return (q.get(k) || '').toLowerCase()
        }
        w.__SALON_GAS_CHECK__ =
          !preview &&
          v('variant') === 'b5b' &&
          v('utm_source') === 'internal' &&
          v('utm_medium') === 'check' &&
          v('utm_campaign') === 'salon_test5_check' &&
          Date.now() < new Date(CHECK_START_AT).getTime()
      })(window)
    </script>

    <!-- =========================
         Microsoft Clarity
    ========================== -->
    <!-- 本番ビルド以外・試用アクセスでは読み込まない（%MODE% はViteが置換） -->
    <script type="text/javascript">
      ;(function (c, l, a, r, i, t, y) {
        if ('%MODE%' !== 'production' || c.__SALON_PREVIEW__ || c.__SALON_GAS_CHECK__) return

        c[a] =
          c[a] ||
          function () {
            ;(c[a].q = c[a].q || []).push(arguments)
          }

        t = l.createElement(r)
        t.async = 1
        t.src = 'https://www.clarity.ms/tag/' + i

        y = l.getElementsByTagName(r)[0]
        y.parentNode.insertBefore(t, y)
      })(
        window,
        document,
        'clarity',
        'script',
        'xi8csm8bc3'
      )
    </script>

    <!-- =========================
         Meta Pixel
    ========================== -->
    <script>
      ;(function (f, b, e, v, n, t, s) {
        // 本番ビルド以外・試用アクセス・GAS実測確認モードでは送信しない
        if ('%MODE%' !== 'production' || f.__SALON_PREVIEW__ || f.__SALON_GAS_CHECK__) {
          f.fbq = function () {}
          return
        }

        if (f.fbq) return

        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments)
        }

        if (!f._fbq) {
          f._fbq = n
        }

        n.push = n
        n.loaded = true
        n.version = '2.0'
        n.queue = []

        t = b.createElement(e)
        t.async = true
        t.src = v

        s = b.getElementsByTagName(e)[0]
        s.parentNode.insertBefore(t, s)
      })(
        window,
        document,
        'script',
        'https://connect.facebook.net/en_US/fbevents.js'
      )

      fbq('init', '274416946098932')
      fbq('track', 'PageView')
    </script>
  </head>

  <body>
    <!-- =========================
         Meta Pixel noscript
    ========================== -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=274416946098932&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>

    <!-- =========================
         React App
    ========================== -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
